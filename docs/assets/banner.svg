<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">agentic-framework</title>
  <desc id="d">You decide. AI agents build. Evidence decides what is done. A round flows from You to Brain to Worker to Verifier, and merges only with evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1024"/>
      <stop offset="1" stop-color="#17153a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#6d7cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6d7cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#3ecfb2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f9bd6"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="96" y="120" width="252" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="222" y="146" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="17" fill="#b9c2ff" letter-spacing="1">git is the only memory</text>

    <text x="96" y="250" font-size="84" font-weight="700" fill="#ffffff" letter-spacing="-1.5">agentic-framework</text>
    <rect x="98" y="276" width="220" height="6" rx="3" fill="url(#accent)"/>

    <text x="96" y="344" font-size="36" font-weight="600" fill="#dfe4ff">You decide. AI agents build.</text>
    <text x="96" y="392" font-size="36" font-weight="600" fill="#dfe4ff">Evidence decides what is done.</text>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle">
    <line x1="228" y1="512" x2="302" y2="512" stroke="#8f9bd6" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="470" y1="512" x2="544" y2="512" stroke="#8f9bd6" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="712" y1="512" x2="786" y2="512" stroke="#8f9bd6" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="954" y1="512" x2="1028" y2="512" stroke="#8f9bd6" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="96" y="480" width="128" height="64" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="160" y="519" fill="#ffffff">You</text>

    <rect x="306" y="480" width="160" height="64" rx="16" fill="#7c8cff" fill-opacity="0.16" stroke="#7c8cff" stroke-opacity="0.8"/>
    <text x="386" y="519" fill="#ffffff">Brain</text>

    <rect x="548" y="480" width="160" height="64" rx="16" fill="#7c8cff" fill-opacity="0.16" stroke="#7c8cff" stroke-opacity="0.8"/>
    <text x="628" y="519" fill="#ffffff">Worker</text>

    <rect x="790" y="480" width="160" height="64" rx="16" fill="#7c8cff" fill-opacity="0.16" stroke="#7c8cff" stroke-opacity="0.8"/>
    <text x="870" y="519" fill="#ffffff">Verifier</text>

    <rect x="1032" y="480" width="152" height="64" rx="16" fill="#3ecfb2" fill-opacity="0.16" stroke="#3ecfb2" stroke-opacity="0.9"/>
    <path d="M1060 512 l10 10 l20 -22" fill="none" stroke="#3ecfb2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1136" y="519" fill="#ffffff">Merged</text>

    <text x="386" y="578" font-size="15" font-weight="500" fill="#8f9bd6">plans · checks</text>
    <text x="628" y="578" font-size="15" font-weight="500" fill="#8f9bd6">does the work</text>
    <text x="870" y="578" font-size="15" font-weight="500" fill="#8f9bd6">reviews blind</text>
    <text x="1108" y="578" font-size="15" font-weight="500" fill="#8f9bd6">only with evidence</text>
  </g>
</svg>
